<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">Participation Planner preview</title><desc id="d">A preview showing several valid response paths and a working response field.</desc><rect width="900" height="620" rx="30" fill="#fbf7ef"/><rect x="46" y="42" width="808" height="536" rx="24" fill="#fff" stroke="#ded8ce" stroke-width="2"/><text x="84" y="93" fill="#9a593e" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">6 · CHOOSE A WORKING RESPONSE</text><text x="84" y="145" fill="#31412f" font-family="Georgia,serif" font-size="34">What kind of participation fits now?</text><text x="84" y="181" fill="#6f665d" font-family="Arial,sans-serif" font-size="17">More than one path can be meaningful. No action yet is a valid response.</text><g font-family="Arial,sans-serif" font-size="16" font-weight="700"><rect x="84" y="220" width="216" height="56" rx="14" fill="#31412f"/><text x="111" y="254" fill="#fff">Ask for support</text><rect x="318" y="220" width="216" height="56" rx="14" fill="#fff" stroke="#cfc8bc"/><text x="345" y="254" fill="#31412f">Set a boundary</text><rect x="552" y="220" width="216" height="56" rx="14" fill="#fff" stroke="#cfc8bc"/><text x="579" y="254" fill="#31412f">Change conditions</text><rect x="84" y="292" width="216" height="56" rx="14" fill="#fff" stroke="#cfc8bc"/><text x="111" y="326" fill="#31412f">Direct action</text><rect x="318" y="292" width="216" height="56" rx="14" fill="#fff" stroke="#cfc8bc"/><text x="345" y="326" fill="#31412f">Act together</text><rect x="552" y="292" width="216" height="56" rx="14" fill="#fff" stroke="#cfc8bc"/><text x="579" y="326" fill="#31412f">Wait / no action yet</text></g><text x="84" y="399" fill="#31412f" font-family="Arial,sans-serif" font-size="17" font-weight="700">The smallest meaningful response I can participate in:</text><rect x="84" y="418" width="684" height="94" rx="14" fill="#fbf7ef" stroke="#cfc8bc"/><text x="106" y="451" fill="#6f665d" font-family="Arial,sans-serif" font-size="16">Describe a response, request, accommodation, boundary,</text><text x="106" y="478" fill="#6f665d" font-family="Arial,sans-serif" font-size="16">environmental change, pause, or another possibility…</text><rect x="84" y="533" width="230" height="9" rx="5" fill="#c89468"/></svg>
