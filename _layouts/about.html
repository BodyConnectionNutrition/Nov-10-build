---
layout: default
---
<style>
.about-hero{padding:clamp(3.5rem,8vw,7rem) 0;background:linear-gradient(135deg,#f1eadf 0%,#fbf7ef 72%)}.about-hero-grid{display:grid;grid-template-columns:1.08fr .72fr;gap:clamp(2rem,6vw,5rem);align-items:center}.about-hero h1{font-size:clamp(2.8rem,6vw,5.4rem)}.about-portrait{margin:0;position:relative}.about-portrait:before{content:"";position:absolute;inset:-16px 18px 18px -16px;border:2px solid rgba(200,148,104,.55);border-radius:34% 66% 58% 42%/48% 42% 58% 52%}.about-portrait img{position:relative;display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:34% 66% 58% 42%/48% 42% 58% 52%;box-shadow:var(--shadow)}.about-portrait figcaption{position:relative;margin-top:1rem;color:var(--muted);font-size:.88rem}.about-body{padding:clamp(4rem,8vw,7rem) 0}.about-story{display:grid;grid-template-columns:.72fr 1.28fr;gap:clamp(2rem,6vw,5rem);align-items:start}.about-story .eyebrow{position:sticky;top:110px}.about-lead{font-family:"Fraunces",Georgia,serif;font-size:clamp(1.5rem,3vw,2.25rem);line-height:1.25;color:var(--forest)}.about-expertise{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin:2rem 0}.about-expertise .card{box-shadow:none}.about-expertise .number{background:var(--forest)}.about-human{margin:4rem 0}.about-next{margin-top:4rem;background:var(--forest);color:#fff;border-radius:32px;padding:clamp(2rem,6vw,4.5rem);display:grid;grid-template-columns:1.25fr .75fr;gap:2rem;align-items:center}.about-next h2,.about-next p{color:#fff}.about-next .button{background:var(--clay);border-color:var(--clay)}.about-next .text-link{color:#fff}.about-actions{display:flex;flex-direction:column;align-items:flex-start;gap:.8rem}@media(max-width:820px){.about-hero-grid,.about-story,.about-next{grid-template-columns:1fr}.about-portrait{max-width:520px}.about-story .eyebrow{position:static}.about-expertise{grid-template-columns:1fr}}
</style>
<section class="about-hero"><div class="container about-hero-grid"><div><p class="eyebrow">{{ page.eyebrow }}</p><h1>{{ page.title }}</h1><p class="lead">{{ page.intro }}</p></div><figure class="about-portrait"><img src="{{ page.photo | relative_url }}" alt="{{ page.photo_alt }}" width="435" height="439"><figcaption>{{ page.photo_caption }}</figcaption></figure></div></section>
<article class="container about-body">{{ content }}</article>
