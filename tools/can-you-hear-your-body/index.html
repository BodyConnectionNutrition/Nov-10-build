<style>
:root{--dark:#31412f;--moss:#566b4f;--sage:#8fa690;--clay:#c89468;--ivory:#fbf7ef;--paper:#fffdf8;--ink:#2e2b27;--muted:#6f665d;--line:rgba(46,43,39,.14);--soft:rgba(143,166,144,.16)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top left,rgba(200,148,104,.10),transparent 34%),radial-gradient(circle at bottom right,rgba(143,166,144,.12),transparent 36%),var(--ivory);color:var(--ink);font:16px/1.68 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(960px,92%);margin:auto;padding:24px 0 34px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none}.mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--dark);color:white;font-family:Georgia,serif}.brand strong{display:block;color:var(--dark)}.brand small{color:var(--muted)}.home{color:var(--moss);text-decoration:none;font-weight:700}.app{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 65px rgba(49,65,47,.12);overflow:hidden;min-height:650px}.progress{padding:18px 24px 0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.track{height:7px;background:rgba(86,107,79,.10);border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--moss));transition:width .25s ease}.screen{padding:44px 52px 48px}.eye{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--moss);margin-bottom:12px}h1,h2,h3{font-family:Georgia,serif;color:var(--dark);font-weight:400;margin:0}h1{font-size:clamp(42px,6vw,66px);line-height:1}h2{font-size:clamp(31px,4vw,46px);line-height:1.08}h3{font-size:24px}.lead{font-size:19px;line-height:1.7;color:#443f39;max-width:760px;margin:22px 0}.copy{max-width:760px;color:#49423c}.copy p{margin:0 0 14px}.callout{margin:24px 0;padding:21px 23px;border-left:4px solid var(--clay);background:rgba(200,148,104,.08);border-radius:0 16px 16px 0}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:30px}.btn{border:1px solid var(--dark);background:var(--dark);color:white;border-radius:999px;padding:12px 20px;font-weight:800;cursor:pointer}.btn.alt{background:transparent;color:var(--dark)}.btn:disabled{opacity:.35;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}.choice{border:1px solid var(--line);background:white;border-radius:15px;padding:13px;text-align:left;cursor:pointer;color:#49423c}.choice.sel{border-color:var(--moss);background:var(--soft);color:var(--dark);font-weight:700}.section-card{border:1px solid var(--line);border-radius:20px;background:white;padding:20px;margin:20px 0}.section-card h3{margin-bottom:8px}.signal-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px;cursor:pointer}.chip.sel{background:var(--dark);border-color:var(--dark);color:white}.timer-wrap{text-align:center;padding:28px 0 8px}.timer{width:150px;height:150px;border-radius:50%;margin:auto;display:grid;place-items:center;border:10px solid rgba(143,166,144,.22);font-family:Georgia,serif;font-size:48px;background:white;color:var(--dark)}textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit}.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:12px;margin:22px 0}.pairbox{background:white;border:1px solid var(--line);border-radius:20px;padding:20px}.pairbox .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--moss);margin-bottom:8px}.arrow{display:grid;place-items:center;color:var(--clay);font-size:26px}.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:24px 0}.map-card{border:1px solid var(--line);border-radius:20px;background:white;padding:20px}.map-card h3{margin-bottom:6px}.map-card p{color:var(--muted);font-size:14px}.tag{display:inline-block;border-radius:999px;background:rgba(200,148,104,.12);padding:5px 8px;margin:3px;font-size:12px}.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:24px 0}.flow span{background:var(--soft);color:var(--dark);border-radius:999px;padding:9px 12px;font-weight:700}.flow b{color:var(--clay)}.practice-path{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0}.practice-path span{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--muted)}.practice-path span.active{background:var(--dark);border-color:var(--dark);color:white}.final-note{background:var(--dark);color:white;border-radius:22px;padding:24px;margin-top:24px}.final-note h3{color:white;margin-bottom:8px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}@media(max-width:740px){.screen{padding:34px 22px 38px}.grid,.map,.pair{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.brand small{display:none}.app{min-height:600px}}@media print{body{background:white}.head,.progress,.actions,.footer{display:none!important}.shell{width:100%;padding:0}.app{box-shadow:none;border:0;min-height:0}.screen{padding:0}}
</style>
<style>
.completion{margin-top:30px;border-top:1px solid var(--line);padding-top:28px}.completion-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.next-card{border:1px solid var(--line);border-radius:20px;background:white;padding:20px}.next-card.primary{background:var(--dark);color:white}.next-card.primary h3{color:white}.next-card p{color:var(--muted)}.next-card.primary p{color:rgba(255,255,255,.82)}.next-card .btn{display:inline-block;text-decoration:none;margin-top:8px}.next-card.primary .btn{background:var(--clay);border-color:var(--clay)}.signup{background:rgba(143,166,144,.16);border-radius:20px;padding:22px;margin:20px 0}.signup-grid{display:grid;grid-template-columns:1fr auto;gap:10px}.signup input{min-width:0;width:100%;border:1px solid var(--line);border-radius:999px;padding:12px 15px;font:inherit;background:white}.fine{color:var(--muted);font-size:12px}@media(max-width:740px){.completion-grid,.signup-grid{grid-template-columns:1fr}}@media print{.completion{display:none!important}}
</style>

<body>
<div class="shell">
<header class="head"><a class="brand" href="https://bodyconnectionnutrition.com/"><span class="mark">BC</span><span><strong>Body Connection Nutrition</strong><small>A path to peace with your body</small></span></a><a class="home" href="https://bodyconnectionnutrition.com/">← Home site</a></header>
<main class="app" id="app"></main>
<form name="body-signal-companion" method="POST" action="/body-signal-companion/" data-netlify="true" netlify-honeypot="bot-field" hidden><input type="hidden" name="form-name" value="body-signal-companion"><input name="bot-field"><input type="email" name="email"><input name="source"></form>
<div class="footer">Educational experience • Not medical or mental health treatment</div>
</div>
<script>
const app=document.getElementById('app');
const signalGroups={
  fuel:['Hunger','Food thoughts','Appetite','Energy drop','Fading concentration','Weakness'],
  eating:['Fullness','Satisfaction','Pleasure','Desire for more','Loss of interest in food','Digestive discomfort'],
  regulation:['Tension','Agitation','Calm','Restlessness','Breathing changes','Heartbeat changes'],
  physical:['Thirst','Fatigue','Sleepiness','Pain','Temperature','Need to move','Need to stop moving'],
  positive:['Comfort','Warmth','Ease','Strength','Steadiness','Physical pleasure']
};
const allSignals=Object.values(signalGroups).flat();
const state={step:0,easy:[],late:[],hard:[],context:'',noticed:[],meaning:'',reaction:[],reflection:''};
const steps=[intro,easySignals,lateSignals,hardSignals,contextScreen,experimentIntro,experimentTimer,whatNoticed,whatMeant,seeGap,response,mapScreen,reveal,carry];
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(){if(state.step===0||state.step===steps.length-1)return'';const pct=Math.round((state.step/(steps.length-1))*100);return `<div class="progress"><div class="meta"><span>Body Signal Map</span><span>${pct}%</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`}
function nav(next='Continue'){return `<div class="actions">${state.step?'<button class="btn alt" data-back>Back</button>':'<span></span>'}<button class="btn" data-next>${next}</button></div>`}
function render(){scrollTo(0,0);app.innerHTML=progress()+steps[state.step]();bind()}
function intro(){return `<section class="screen"><div class="eye">A Body Connection awareness experience</div><h1>Can You Hear Your Body?</h1><p class="lead">Your body produces information. Hunger, fullness, fatigue, tension, thirst, comfort, pain, energy, restlessness, satisfaction, and more.</p><div class="practice-path" aria-label="Body Connection practice"><span class="active">1 · Notice</span><span class="active">2 · Interpret</span><span>3 · Contextualize</span><span>4 · Locate responsibility</span><span>5 · Respond</span></div><div class="copy"><p>This experience focuses on the first two parts of the Body Connection practice: noticing body information and separating it from the meaning attached to it.</p><p>But a sensation and the explanation we give that sensation are not the same event. Often they happen so quickly together that they feel like one thing.</p></div><div class="callout"><strong>This is not a test of whether you read your body correctly.</strong><br>There is no universal body-signal dictionary here. Signals are information, not commands, and “I don't know yet” is useful information.</div>${nav('Begin')}</section>`}
function chipsFor(arr,key){return `<div class="signal-list">${arr.map(x=>`<button class="chip ${state[key].includes(x)?'sel':''}" data-array="${key}" data-value="${esc(x)}">${x}</button>`).join('')}</div>`}
function groupBlocks(key){return Object.entries(signalGroups).map(([g,items])=>`<div class="section-card"><h3>${({fuel:'Fuel & energy',eating:'Eating experience',regulation:'Arousal & regulation',physical:'Physical needs',positive:'Comfort & positive sensation'})[g]}</h3>${chipsFor(items,key)}</div>`).join('')}
function easySignals(){return `<section class="screen"><div class="eye">1 · What do you notice?</div><h2>Which signals are usually fairly easy for you to notice?</h2><p class="lead">Choose signals you tend to recognize without needing them to become intense first. This is about familiarity, not performance.</p>${groupBlocks('easy')}${nav()}</section>`}
function lateSignals(){return `<section class="screen"><div class="eye">2 · What arrives late?</div><h2>Which signals tend to become obvious only after they get stronger?</h2><p class="lead">A signal can be present before it reaches conscious attention. Select anything you often notice only when it is already pronounced.</p>${groupBlocks('late')}${nav()}</section>`}
function hardSignals(){return `<section class="screen"><div class="eye">3 · What is hard to interpret?</div><h2>Which signals are difficult to make sense of?</h2><p class="lead">You may notice the sensation clearly and still be unsure what it means. That uncertainty is not failure; it is part of the map.</p>${groupBlocks('hard')}${nav('Continue')}</section>`}
function contextScreen(){return `<section class="screen"><div class="eye">4 · Context changes what is available</div><h2>What conditions or learned expectations affect what is easy to notice?</h2><p class="lead">This question is optional. Signals can become clearer, quieter, delayed, confusing, or costly to respond to depending on what your body and life have repeatedly required.</p><div class="copy"><p>You might consider stress, illness, medication, sleep, neurodivergence, trauma, work, caregiving, food access, privacy, safety, past restriction, medical advice, family rules, or expectations about what your body <em>should</em> need.</p></div><textarea id="context" placeholder="Optional: What makes signals easier or harder to notice or respond to?">${esc(state.context)}</textarea><div class="callout"><strong>Context is not an excuse or a verdict.</strong><br>It is part of an accurate explanation.</div>${nav('Try a 30-second experiment')}</section>`}
function experimentIntro(){return `<section class="screen"><div class="eye">4 · The experiment</div><h2>For 30 seconds, don't solve anything.</h2><p class="lead">Stay where you are. Don't correct your posture, take a drink, eat, stretch, or deliberately change your breathing unless you need to for comfort or safety.</p><div class="callout"><strong>Just notice.</strong><br>What is already happening in your body?</div>${nav('Start 30 seconds')}</section>`}
function experimentTimer(){return `<section class="screen"><div class="eye">Just notice</div><h2>Nothing to interpret yet.</h2><div class="timer-wrap"><div class="timer" id="timer">30</div><p>Notice sensation before explanation.</p></div><div class="actions"><button class="btn alt" data-back>Back</button><button class="btn" id="timerNext" disabled>Continue</button></div></section>`}
function whatNoticed(){return `<section class="screen"><div class="eye">5 · What did your body say?</div><h2>What did you physically notice?</h2><p class="lead">Select anything that was present. You are recording sensation, not explaining it.</p>${chipsFor(allSignals.concat(['Nothing obvious','Something else']),'noticed')}${nav()}</section>`}
function whatMeant(){const n=state.noticed.length?state.noticed.join(', '):'whatever you noticed';return `<section class="screen"><div class="eye">6 · What did your mind add?</div><h2>What did you immediately think it meant?</h2><p class="lead">You noticed: <strong>${esc(n)}</strong>.</p><div class="copy"><p>Now separate that from the explanation that arrived next. The explanation might be practical, judgmental, uncertain, compassionate, medical, habitual, or absent.</p><p>Examples: “I need rest.” “I shouldn't be tired.” “I probably need food.” “Something is wrong.” “I don't know.” “No interpretation appeared.”</p></div><textarea id="meaning" placeholder="What did you think the sensation meant?">${esc(state.meaning)}</textarea>${nav('See the gap')}</section>`}
function seeGap(){const body=state.noticed.length?state.noticed.join(', '):'No clear signal selected';const meaning=state.meaning.trim()||'No immediate interpretation recorded';return `<section class="screen"><div class="eye">7 · Notice the gap</div><h2>These are related. They are not identical.</h2><div class="pair"><div class="pairbox"><div class="label">Body said</div><h3>${esc(body)}</h3><p>The sensation or body information you noticed.</p></div><div class="arrow">→</div><div class="pairbox"><div class="label">Mind added</div><h3>${esc(meaning)}</h3><p>The meaning, explanation, prediction, or judgment that followed.</p></div></div><div class="callout"><strong>The sensation happened. The interpretation is an inference about the sensation.</strong><br>It may be useful. It may be incomplete. It may change with context. You do not have to settle the question immediately.</div>${nav('What happened next?')}</section>`}
const reactions=['I responded fairly directly.','I questioned the signal.','I waited for more evidence.','I compared it with a rule or plan.','I judged the signal or myself.','I ignored or postponed it.','My response depended on context.','I was not sure what to do.','Nothing in particular happened.'];
function response(){return `<section class="screen"><div class="eye">8 · After meaning arrives</div><h2>What tended to happen next?</h2><p class="lead">This is intentionally brief. We are not analyzing the whole behavior chain yet; we are only noticing that interpretation can shape response.</p><div class="grid">${reactions.map(x=>`<button class="choice ${state.reaction.includes(x)?'sel':''}" data-array="reaction" data-value="${esc(x)}">${x}</button>`).join('')}</div>${nav('Build my Body Signal Map')}</section>`}
function tags(arr){return arr.length?arr.map(x=>`<span class="tag">${esc(x)}</span>`).join(''):'<span class="tag">Nothing selected</span>'}
function mapScreen(){return `<section class="screen"><div class="eye">Your Body Signal Map</div><h2>Patterns matter more than scores.</h2><p class="lead">This map shows where body information tends to be easy to notice, late to arrive in awareness, difficult to interpret, or quickly surrounded by meaning.</p><div class="map"><div class="map-card"><h3>Easy for me to notice</h3><p>Signals that tend to enter awareness readily.</p>${tags(state.easy)}</div><div class="map-card"><h3>I tend to notice these late</h3><p>Signals that often become obvious only after growing stronger.</p>${tags(state.late)}</div><div class="map-card"><h3>Hard for me to interpret</h3><p>Sensations I may notice without being sure what they mean.</p>${tags(state.hard)}</div><div class="map-card"><h3>Meaning arrives quickly here</h3><p>Your experiment showed how quickly a sensation can acquire an explanation.</p><span class="tag">Body: ${esc(state.noticed.join(', ')||'No clear signal')}</span><span class="tag">Meaning: ${esc(state.meaning.trim()||'No interpretation recorded')}</span></div><div class="map-card"><h3>Context affecting access</h3><p>Conditions or learned expectations that may make signals easier or harder to notice or respond to.</p><span class="tag">${esc(state.context.trim()||'No context recorded')}</span></div></div><div class="callout"><strong>This is not an interoception score.</strong><br>Signals can be clearer or harder to notice depending on stress, illness, medication, sleep, neurodivergence, attention, past experience, environment, and the signal itself.</div>${nav('What this means')}</section>`}
function reveal(){return `<section class="screen"><div class="eye">The educational reveal</div><h2>A body signal is information. Interpretation is an inference.</h2><div class="flow"><span>BODY SIGNAL</span><b>→</b><span>WHAT I NOTICE</span><b>→</b><span>WHAT I THINK IT MEANS</span><b>→</b><span>WHAT HAPPENS NEXT</span></div><div class="copy"><p>Sometimes the interpretation is straightforward. Sometimes several explanations are plausible at once. Sometimes the most accurate answer is simply, “I don't know yet.”</p><p>The goal is not to distrust your body or distrust your mind. It is to notice that sensation and explanation are two different kinds of information.</p><p>That small separation creates room for curiosity before certainty.</p></div><div class="final-note"><h3>Two questions can now travel together.</h3><p><strong>What was my body communicating?</strong><br><strong>What was my framework telling me that signal meant?</strong></p></div>${nav('Carry it with you')}</section>`}
function recommendation(){const joined=[...state.easy,...state.late,...state.hard,...state.noticed].join(' ').toLowerCase();const reactionsText=state.reaction.join(' ').toLowerCase();if(reactionsText.includes('rule or plan')||reactionsText.includes('judged'))return{name:'Permission & Scarcity',why:'Examine whether rules, judgment, or restriction are creating urgency around food.',url:'/tools/permission-and-scarcity/'};if(reactionsText.includes('depended on context')||reactionsText.includes('ignored or postponed'))return{name:'Choice Has Conditions',why:'Map the conditions that made a signal easier or harder to respond to.',url:'/tools/choice-has-conditions/'};if(/tension|agitation|restlessness|calm|breathing|heartbeat/.test(joined))return{name:'What Is This Doing for Me?',why:'Explore what a repeated response may be helping your system accomplish.',url:'/tools/what-is-this-doing-for-me/'};return{name:'Behavior Sequence',why:'Slow one moment down and see what happened before, during, and after it.',url:'/tools/behavior-sequence/'}}
function resultText(){return `CAN YOU HEAR YOUR BODY? — BODY SIGNAL MAP\n\nEasy for me to notice:\n${state.easy.join(', ')||'Nothing selected'}\n\nI tend to notice these late:\n${state.late.join(', ')||'Nothing selected'}\n\nHard for me to interpret:\n${state.hard.join(', ')||'Nothing selected'}\n\nContext affecting what is easy to notice or respond to:\n${state.context.trim()||'Not recorded'}\n\n30-second experiment\nBody information: ${state.noticed.join(', ')||'No clear signal selected'}\nMeaning my mind added: ${state.meaning.trim()||'No interpretation recorded'}\nWhat happened next: ${state.reaction.join(' ')||'No response selected'}\n\nSignal I want to notice with more curiosity:\n${state.reflection.trim()||'Not recorded'}\n\nA body signal is information. Interpretation is an inference.\n\nCreated at BodyConnectionNutrition.com`}
function carry(){const rec=recommendation();return `<section class="screen"><div class="eye">Carry it with you</div><h2>Choose one signal to notice this week.</h2><p class="lead">You do not need to fix it, respond perfectly, or determine its single true meaning.</p><div class="section-card"><h3>When it appears, ask three questions:</h3><p><strong>1. What did I physically notice?</strong></p><p><strong>2. What did I immediately think it meant?</strong></p><p><strong>3. What happened next?</strong></p></div><textarea id="reflection" placeholder="Optional: which signal would you like to notice with more curiosity?">${esc(state.reflection)}</textarea><div class="actions"><button class="btn alt" data-back>Back</button><button class="btn alt" id="downloadMap">Download my map</button><button class="btn alt" id="emailMap">Email my map</button></div><div class="signup"><h3>Take the companion reflection with you.</h3><p>Join the Body Connection list and continue immediately to a short reflection that helps you observe one signal without scoring or grading it.</p><form name="body-signal-companion" method="POST" action="/body-signal-companion/" data-netlify="true" class="signup-grid"><input type="hidden" name="form-name" value="body-signal-companion"><input type="hidden" name="source" value="Can You Hear Your Body completion"><label><span class="fine">Email address</span><input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn" type="submit">Get the reflection →</button></form><p class="fine">No score, streak, or behavior grade. Unsubscribe whenever you want.</p></div><div class="completion"><div class="eye">The shared practice continues</div><h2>Contextualize. Locate responsibility. Respond.</h2><div class="practice-path" aria-label="Body Connection practice"><span>1 · Notice</span><span>2 · Interpret</span><span class="active">3 · Contextualize</span><span class="active">4 · Locate responsibility</span><span class="active">5 · Respond</span></div><p>You have separated body information from interpretation. The next experience helps you widen the context around one eating moment, identify what is yours to influence and what requires support or changed conditions, and decide whether any response fits now. It is optional—not a test or prerequisite.</p><div class="completion-grid"><article class="next-card primary"><div class="eye" style="color:#e8d1bd">Recommended continuation</div><h3>Why Am I Eating?</h3><p>You separated a signal from the meaning attached to it. Now take one eating moment apart and see the biological, learned, emotional, environmental, social, habitual, and reward-related forces operating together.</p><a class="btn" href="/why-am-i-eating/">Continue · $29 →</a></article><article class="next-card"><div class="eye">Based on your map</div><h3>${esc(rec.name)}</h3><p>${esc(rec.why)}</p><a class="btn alt" href="${rec.url}">See this tool · $29 →</a></article></div></div><div class="callout"><strong>“I don't know yet” is allowed.</strong><br>Curiosity is not a promise that every signal will become obvious. It is a way to keep interpretation from masquerading as the signal itself.</div><p style="color:var(--muted);font-size:13px">This experience is educational and does not diagnose symptoms or replace individualized medical or mental-health care. New, severe, persistent, or concerning physical symptoms deserve appropriate medical assessment.</p><div class="actions"><span></span><button class="btn alt" id="restart">Start again</button></div></section>`}
function downloadMap(){saveText();const blob=new Blob([resultText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-body-signal-map.txt';a.click();URL.revokeObjectURL(url)}
function emailMap(){saveText();const subject=encodeURIComponent('My Body Signal Map');const body=encodeURIComponent(resultText());window.location.href=`mailto:?subject=${subject}&body=${body}`}
function saveText(){const m=document.getElementById('meaning');if(m)state.meaning=m.value;const c=document.getElementById('context');if(c)state.context=c.value;const r=document.getElementById('reflection');if(r)state.reflection=r.value}
function toggle(key,val,btn){const arr=state[key],i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val);btn.classList.toggle('sel')}
function bind(){document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{saveText();if(state.step<steps.length-1){state.step++;render()}});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{saveText();if(state.step>0){state.step--;render()}});document.querySelectorAll('[data-array]').forEach(b=>b.onclick=()=>toggle(b.dataset.array,b.dataset.value,b));const m=document.getElementById('meaning');if(m)m.oninput=()=>state.meaning=m.value;const c=document.getElementById('context');if(c)c.oninput=()=>state.context=c.value;const r=document.getElementById('reflection');if(r)r.oninput=()=>state.reflection=r.value;const download=document.getElementById('downloadMap');if(download)download.onclick=downloadMap;const email=document.getElementById('emailMap');if(email)email.onclick=emailMap;const restart=document.getElementById('restart');if(restart)restart.onclick=()=>{Object.assign(state,{step:0,easy:[],late:[],hard:[],context:'',noticed:[],meaning:'',reaction:[],reflection:''});render()};if(state.step===6)startTimer()}
function startTimer(){let n=30;const el=document.getElementById('timer'),next=document.getElementById('timerNext');const id=setInterval(()=>{n--;if(el)el.textContent=n;if(n<=0){clearInterval(id);if(el)el.textContent='✓';if(next){next.disabled=false;next.onclick=()=>{state.step++;render()}}}},1000)}
render();
