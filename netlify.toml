[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.2"
  JEKYLL_ENV = "production"

[functions]
  included_files = ["netlify/functions/private/**"]

[[redirects]]
  from = "/patient-tools/login"
  to = "/.netlify/functions/patient-login"
  status = 200

[[redirects]]
  from = "/patient-tools/why-am-i-eating"
  to = "/.netlify/functions/patient-why-am-i-eating"
  status = 200

[[redirects]]
  from = "/patient-tools/why-am-i-eating/"
  to = "/.netlify/functions/patient-why-am-i-eating"
  status = 200

[[redirects]]
  from = "/patient-tools"
  to = "/.netlify/functions/patient-tools?path="
  status = 200

[[redirects]]
  from = "/patient-tools/"
  to = "/.netlify/functions/patient-tools?path="
  status = 200

[[redirects]]
  from = "/patient-tools/*"
  to = "/.netlify/functions/patient-tools?path=:splat"
  status = 200
