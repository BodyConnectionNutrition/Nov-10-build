[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.2"
  JEKYLL_ENV = "production"

[functions]
  included_files = ["netlify/functions/private/**"]

[[redirects]]
  from = "/patient-tools/login"
  to = "/.netlify/functions/patient-login"
  status = 200

[[redirects]]
  from = "/patient-tools/logout"
  to = "/.netlify/functions/patient-hub?logout=1"
  status = 200

[[redirects]]
  from = "/patient-tools/why-am-i-eating"
  to = "/.netlify/functions/patient-tools?path=why-am-i-eating"
  status = 200

[[redirects]]
  from = "/patient-tools/who-taught-you-to-eat"
  to = "/.netlify/functions/patient-tools?path=who-taught-you-to-eat"
  status = 200

[[redirects]]
  from = "/patient-tools/how-was-my-body-image-created"
  to = "/.netlify/functions/patient-tools?path=how-was-my-body-image-created"
  status = 200

[[redirects]]
  from = "/patient-tools/deconstructing-a-belief"
  to = "/.netlify/functions/patient-tools?path=deconstructing-a-belief"
  status = 200

[[redirects]]
  from = "/patient-tools"
  to = "/.netlify/functions/patient-hub"
  status = 200

[[redirects]]
  from = "/patient-tools/"
  to = "/.netlify/functions/patient-hub"
  status = 200

[[redirects]]
  from = "/patient-tools/*"
  to = "/.netlify/functions/patient-tools?path=:splat"
  status = 200
