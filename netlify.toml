[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.2.2"
  JEKYLL_ENV = "production"

[functions]
  included_files = ["netlify/functions/private/**"]

[[redirects]]
  from = "/patient-tools/login"
  to = "/.netlify/functions/patient-login"
  status = 200

[[redirects]]
  from = "/patient-tools/why-am-i-eating"
  to = "/.netlify/functions/patient-tools?path=why-am-i-eating"
  status = 200

[[redirects]]
  from = "/patient-tools/can-you-hear-your-body"
  to = "/tools/can-you-hear-your-body/"
  status = 302

[[redirects]]
  from = "/patient-tools/who-taught-you-to-eat"
  to = "/tools/who-taught-you-to-eat/"
  status = 302

[[redirects]]
  from = "/patient-tools/how-was-my-body-image-created"
  to = "/tools/how-was-my-body-image-created/"
  status = 302

[[redirects]]
  from = "/patient-tools/deconstructing-a-belief"
  to = "/tools/deconstructing-a-belief/"
  status = 302

[[redirects]]
  from = "/patient-tools/logout"
  to = "/.netlify/functions/patient-tools?path=logout"
  status = 200

[[redirects]]
  from = "/patient-tools"
  to = "/.netlify/functions/patient-tools?path="
  status = 200

[[redirects]]
  from = "/patient-tools/"
  to = "/.netlify/functions/patient-tools?path="
  status = 200

[[redirects]]
  from = "/patient-tools/*"
  to = "/.netlify/functions/patient-tools?path=:splat"
  status = 200
